[package]
name = "mj-universel"
version = "0.3.17"
edition = "2021"
description = "L2 finale : stabilisation de SQLite et coherence multijoueur (schema 27)"
license = "MIT"

[dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
base64 = "0.22"
